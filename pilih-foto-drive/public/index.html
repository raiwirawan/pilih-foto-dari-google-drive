<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilih Foto untuk Diedit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e7ea;--paper:#fff;--ink:#1c2430;--mute:#66707c;--mark:#2850e8;--line:#cfd4d9;
--f-head:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'DM Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#20252b;--paper:#2b3139;--ink:#e8ecf0;--mute:#9aa4af;--mark:#7d9bff;--line:#3a424c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-bottom:84px}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}
h1{font:700 clamp(24px,5vw,36px)/1.1 var(--f-head);margin:0 0 6px}
header p{margin:0;color:var(--mute);max-width:56ch}
#status{max-width:1200px;margin:12px auto 0;padding:0 20px;color:var(--mute)}
#grid{max-width:1200px;margin:16px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.frame{background:var(--paper);padding:8px 8px 6px;border-radius:3px;cursor:pointer;position:relative;
box-shadow:0 1px 2px rgba(0,0,0,.18);user-select:none;-webkit-tap-highlight-color:transparent}
.frame .ph{aspect-ratio:1;background:var(--line);overflow:hidden;position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame small{display:block;margin-top:6px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame .ring{position:absolute;inset:-4px;border:3px solid var(--mark);border-radius:46% 54% 50% 50%/52% 46% 54% 48%;
transform:rotate(-1.5deg) scale(.96);opacity:0;transition:opacity .15s,transform .2s;pointer-events:none}
.frame.on .ring{opacity:1;transform:rotate(-1.5deg) scale(1)}
.frame.on small{color:var(--mark);font-weight:500}
.zoom{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.9);
color:#1c2430;font-size:15px;cursor:pointer;opacity:0;transition:opacity .15s}
.frame:hover .zoom,.frame:focus-within .zoom{opacity:1}
@media(hover:none){.zoom{opacity:1}}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}
#count{font:600 16px var(--f-head)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.b{font:500 14px var(--f-body);padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--mark);border-color:var(--mark);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#10162a}}
button.p:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
#lb{position:fixed;inset:0;background:rgba(10,14,20,.94);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain}
#lb .cap{color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;background:rgba(255,255,255,.15);color:#fff;border:0;width:44px;height:44px;border-radius:50%;cursor:pointer}
#prev{left:12px}#next{right:12px}#close{position:absolute;top:12px;right:12px;transform:none;font-size:20px}
dialog{border:0;border-radius:12px;padding:20px;width:min(520px,92vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.6)}
dialog h2{font:700 20px var(--f-head);margin:0 0 10px}
dialog textarea{width:100%;min-height:120px;font:400 13px/1.5 var(--f-body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
#list{max-height:140px;overflow:auto;font-size:13px;color:var(--mute);margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
<h1 id="title">Pilih foto untuk diedit</h1>
<p>Ketuk foto yang ingin diedit. Pilihan tersimpan otomatis, jadi kamu bisa kembali kapan saja. Kalau sudah selesai, tekan Kirim ke editor.</p>
</header>
<div id="status" role="status">Memuat foto...</div>
<main id="grid"></main>

<div id="bar">
<span id="count">0 foto dipilih</span>
<div class="btns">
<button class="b" id="all">Pilih semua</button>
<button class="b" id="reset">Hapus pilihan</button>
<button class="b p" id="send" disabled>Kirim ke editor</button>
</div>
</div>

<div id="lb" role="dialog" aria-label="Pratinjau foto">
<button class="nav" id="close" aria-label="Tutup">✕</button>
<button class="nav" id="prev" aria-label="Foto sebelumnya">‹</button>
<img id="lbimg" alt="">
<button class="nav" id="next" aria-label="Foto berikutnya">›</button>
<div class="cap"><span id="lbname"></span><button class="b p" id="lbsel"></button></div>
</div>

<dialog id="dlg">
<h2>Kirim ke editor</h2>
<div id="list"></div>
<textarea id="note" placeholder="Catatan untuk editor (opsional), mis. warna lebih hangat, hilangkan orang di belakang"></textarea>
<div class="btns">
<button class="b p" id="copy">Salin daftar</button>
<button class="b" id="csv">Unduh CSV</button>
<button class="b" id="wa">Kirim via WhatsApp</button>
<button class="b" id="x">Tutup</button>
</div>
</dialog>
<div id="toast"></div>

<script>
/* Konfigurasi dibaca dari server (.env) lewat /api/config */

const $ = id => document.getElementById(id);
let CONFIG = { CLIENT_NAME: 'Klien', EDITOR_WA: '' }, DEMO = true, KEY = 'pilihfoto:demo';
let photos = [], sel = new Set(), cur = 0;

const thumb = (p, w) => DEMO ? p.src : `/api/thumb/${p.id}?w=${w}`;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...sel])); } catch (e) {} };
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); };

async function load() {
  try {
    const c = await (await fetch('/api/config')).json();
    CONFIG = { CLIENT_NAME: c.clientName, EDITOR_WA: c.editorWa };
    DEMO = c.demo; KEY = 'pilihfoto:' + c.albumKey;
  } catch (e) {
    $('status').textContent = 'Server tidak terjangkau. Jalankan dengan: npm start';
    return;
  }
  sel = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  $('title').textContent = 'Pilih foto untuk diedit, ' + CONFIG.CLIENT_NAME;
  if (DEMO) {
    photos = Array.from({ length: 24 }, (_, i) => {
      const n = 'IMG_' + String(1200 + i * 7).padStart(4, '0') + '.jpg', h = (i * 37) % 360;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},55%,62%)"/><stop offset="1" stop-color="hsl(${h + 50},60%,38%)"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><text x="300" y="316" font-size="40" text-anchor="middle" fill="#fff" font-family="sans-serif">${n}</text></svg>`;
      return { id: 'demo' + i, name: n, src: 'data:image/svg+xml,' + encodeURIComponent(svg) };
    });
    $('status').textContent = 'Mode demo: isi GOOGLE_API_KEY dan DRIVE_FOLDER_ID di file .env untuk memakai folder Drive asli.';
    return render();
  }
  try {
    const r = await fetch('/api/photos');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    photos = d;
    $('status').textContent = photos.length ? photos.length + ' foto di folder ini.' : 'Folder ini belum berisi foto.';
    render();
  } catch (e) {
    $('status').textContent = 'Gagal memuat folder: ' + e.message + '. Pastikan folder dibagikan sebagai "Siapa saja yang memiliki link" dan Drive API aktif untuk API key.';
  }
}

function render() {
  $('grid').innerHTML = '';
  photos.forEach((p, i) => {
    const f = document.createElement('figure');
    f.className = 'frame' + (sel.has(p.id) ? ' on' : '');
    f.style.margin = 0; f.dataset.i = i; f.tabIndex = 0;
    f.innerHTML = `<div class="ph"><img loading="lazy" alt="${p.name}" src="${thumb(p, 400)}"><i class="ring"></i><button class="zoom" aria-label="Perbesar ${p.name}">⤢</button></div><small>${p.name}</small>`;
    f.onclick = e => e.target.closest('.zoom') ? openLb(i) : toggle(p.id, f);
    f.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(p.id, f); } };
    $('grid').append(f);
  });
  updateBar();
}

function toggle(id, el) {
  sel.has(id) ? sel.delete(id) : sel.add(id);
  if (el) el.classList.toggle('on', sel.has(id));
  save(); updateBar();
}
function updateBar() {
  $('count').textContent = sel.size + ' foto dipilih';
  $('send').disabled = !sel.size;
  if ($('lb').classList.contains('open')) $('lbsel').textContent = sel.has(photos[cur].id) ? 'Batal pilih' : 'Pilih foto ini';
}
$('all').onclick = () => { photos.forEach(p => sel.add(p.id)); save(); render(); };
$('reset').onclick = () => { if (sel.size && confirm('Hapus semua pilihan?')) { sel.clear(); save(); render(); } };

/* Lightbox */
function openLb(i) { cur = i; $('lb').classList.add('open'); showLb(); }
function showLb() {
  const p = photos[cur];
  $('lbimg').src = thumb(p, 1600); $('lbimg').alt = p.name; $('lbname').textContent = p.name;
  updateBar();
}
const step = d => { cur = (cur + d + photos.length) % photos.length; showLb(); };
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('close').onclick = () => { $('lb').classList.remove('open'); render(); };
$('lbsel').onclick = () => { toggle(photos[cur].id); };
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'Escape') $('close').click();
});
let sx = 0;
$('lb').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
$('lb').addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) step(d > 0 ? -1 : 1); });

/* Kirim ke editor */
const chosen = () => photos.filter(p => sel.has(p.id));
const link = p => `https://drive.google.com/file/d/${p.id}/view`;
const msg = () => {
  const c = chosen(), n = $('note').value.trim();
  return `Foto untuk diedit (${CONFIG.CLIENT_NAME}) - ${c.length} foto\n\n` + c.map((p, i) => `${i + 1}. ${p.name}${DEMO ? '' : ' ' + link(p)}`).join('\n') + (n ? `\n\nCatatan: ${n}` : '');
};
$('send').onclick = () => {
  $('list').innerHTML = chosen().map(p => p.name).join(', ');
  $('dlg').showModal();
};
$('x').onclick = () => $('dlg').close();
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(msg()); toast('Daftar disalin'); } catch (e) { toast('Gagal menyalin'); } };
$('wa').onclick = () => window.open(`https://wa.me/${CONFIG.EDITOR_WA}?text=${encodeURIComponent(msg())}`, '_blank');
$('csv').onclick = () => {
  const rows = [['no', 'nama_file', 'link_drive'], ...chosen().map((p, i) => [i + 1, p.name, DEMO ? '' : link(p)])];
  const blob = new Blob([rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'foto-terpilih.csv'; a.click();
};

load();
</script>
</body>
</html>
